<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>MesTok</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101014; color: #fff; }
    main { width: min(90%, 520px); text-align: center; padding: 32px 20px; }
    h1 { font-size: clamp(2.5rem, 10vw, 4rem); margin: 0 0 12px; letter-spacing: -.05em; }
    p { color: #b9b9c4; line-height: 1.65; }
    .mark { width: 64px; height: 64px; border: 2px solid #fff; border-radius: 20px; display: grid; place-items: center; margin: 0 auto 22px; font-weight: 800; font-size: 28px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">M</div>
    <h1>MesTok</h1>
    <p>A messaging companion for TikTok users.</p>
    <p>This domain is reserved for MesTok app links and sign-in callbacks.</p>
  </main>
</body>
</html>
