<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MesTok — TikTok sign-in</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090a10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,440px);padding:30px;border:1px solid #343047;border-radius:24px;background:#151722;text-align:center}
    .mark{font-size:30px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#42d9f5,#e946a8);color:transparent;background-clip:text}
    p{color:#b7b5c8;line-height:1.7}small{color:#77758a}
  </style>
</head>
<body>
  <main>
    <div class="mark">MESTOK</div>
    <h1>Sign-in complete</h1>
    <p>Your TikTok authorization was processed. If MesTok is installed, Android should open the app automatically. You can close this page if it remains open.</p>
    <small>MesTok is an independent companion project and is not affiliated with TikTok.</small>
  </main>
</body>
</html>
